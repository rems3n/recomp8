const $=(s,r=document)=>r.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ymd(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
function today(){return ymd(new Date())}
function clampDay(s){return s<START?START:s>END?END:s}
function weekNo(s){return Math.floor((pd(s)-pd(START))/864e5/7)+1}
function phase(w){let p='';for(const [k,v] of PHASES) if(w>=k)p=v;return p}
function fmtD(s){return pd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function allDates(){const a=[];for(let d=START;d<=END;d=addDays(d,1))a.push(d);return a}
function defaultTpl(s){const w=weekNo(s),dow=(pd(s).getDay()+6)%7;const row=WEEK_PLAN[w]||WEEK_PLAN.def;return row[dow]}
function defaultDay(s){const t=defaultTpl(s);return {tpl:t,ex:TPL[t].ex.map(([id,sets,reps])=>({id,sets,reps}))}}
function planDay(s){const o=S.plan.days[s];if(!o)return defaultDay(s);return {tpl:o.tpl,ex:o.ex?o.ex.map(e=>({...e})):TPL[o.tpl].ex.map(([id,sets,reps])=>({id,sets,reps}))}}
function mealId(dow,slot){const i=SLOTS.findIndex(s=>s[0]===slot);return (S.meals.week[dow]||{})[slot]||WEEK_MEALS[dow][i]}
function mealsFor(s){const dow=pd(s).getDay();const out={};SLOTS.forEach(([k])=>out[k]=mealId(dow,k));return out}
function lsGet(k){try{return JSON.parse(localStorage.getItem('rc8:'+k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('rc8:'+k,JSON.stringify(v))}catch(e){}}
/* server mode: the page is hosted by its own Node server (Railway) and syncs through /api with a PIN */
function apiKey(){try{return localStorage.getItem('rc8:key')||''}catch(e){return ''}}
async function api(method,path,body){const r=await fetch('/api'+path,{method,headers:{'content-type':'application/json','x-key':apiKey()},body:body?JSON.stringify(body):undefined});if(r.status===401)throw {code:'unauthorized'};if(!r.ok)throw {code:'http_'+r.status};return r.status===204?null:r.json()}
async function save(coll,id,data){
  if(coll==='logs')S.logs[id]=data;else if(coll==='body')S.body[id]=data;else if(coll==='food')S.food[id]=data;
  else if(coll==='plan'&&id==='days')S.plan=data;else if(coll==='plan'&&id==='meals')S.meals=data;else if(coll==='settings')S.settings=data;
  if(S.db){try{await S.db.doc(coll+'/'+id).set(data);}catch(e){toast('Save failed ('+(e.code||'error')+') — kept locally');lsSet(coll+'/'+id,data);return}}
  else if(S.mode==='server'){try{await api('PUT','/'+coll+'/'+id,data)}catch(e){toast('Sync failed — kept on this phone');lsSet(coll+'/'+id,data)}}
  else lsSet(coll+'/'+id,data);
}
async function remove(coll,id){
  if(coll==='logs')delete S.logs[id];if(coll==='body')delete S.body[id];if(coll==='food')delete S.food[id];
  if(S.db){try{await S.db.doc(coll+'/'+id).delete()}catch(e){}}else if(S.mode==='server'){try{await api('DELETE','/'+coll+'/'+id)}catch(e){}}else{try{localStorage.removeItem('rc8:'+coll+'/'+id)}catch(e){}}
}
async function loadAll(){

  }else if(S.db){
    for(const c of ['logs','body','food']){const q=await S.db.collection(c).get();const m={};q.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});S[c]=m;}
    const pdoc=await S.db.doc('plan/days').get();if(pdoc.exists)S.plan=pdoc.data();

/* ================= HELPERS ================= */
function dayLog(s){return S.logs[s]}
function dayDone(s){const l=S.logs[s];return !!(l&&l.done)}
function lastPerf(exId,before){const ds=Object.keys(S.logs).filter(d=>d<before).sort().reverse();for(const d of ds){const e=(S.logs[d].ex||[]).find(x=>x.id===exId);if(e&&e.sets.some(s=>s.done))return {date:d,sets:e.sets.filter(s=>s.done)}}return null}
function repRange(r){const m=String(r).match(/(\d+)(?:-(\d+))?/);if(!m)return null;return [Number(m[1]),m[2]?Number(m[2]):Number(m[1])]}
function progression(ex,before){const lp=lastPerf(ex.id,before);if(!lp)return null;const rr=repRange(ex.reps);if(!rr||/^\d+\s*s\b/.test(String(ex.reps)))return {txt:'Last '+lp.date.slice(5)+': '+lp.sets.map(s=>s.r+(s.w?'@'+s.w:'')).join(', ')};
  const w=Math.max(...lp.sets.map(s=>+s.w||0));const allTop=lp.sets.length>=ex.sets&&lp.sets.every(s=>+s.r>=rr[1]);const lower=['squat','hinge','lunge','hip','legcurl','legext','calf'].includes(EX[ex.id].p);
  return {txt:'Last '+lp.date.slice(5)+': '+lp.sets.map(s=>s.r+'@'+(s.w||0)).join(', '),w,bump:allTop?(lower?10:5):0}}
function macros(s){const f=S.food[s];const t={k:0,p:0,c:0,f:0};(f?.items||[]).forEach(i=>{t.k+=+i.k||0;t.p+=+i.p||0;t.c+=+i.c||0;t.f+=+i.f||0});return t}
function weekDates(w){const mon=addDays(START,(w-1)*7);return Array.from({length:7},(_,i)=>addDays(mon,i)).filter(d=>d<=END)}
function bodyRows(){return Object.values(S.body).sort((a,b)=>a.date<b.date?-1:1)}
function avg7(upto){const rows=bodyRows().filter(r=>r.date<=upto).slice(-7);if(!rows.length)return null;return rows.reduce((a,r)=>a+r.w,0)/rows.length}
function macroBars(s){const t=macros(s),g=S.settings;const row=(l,v,goal,u)=>`<div class="macro"><span>${l}</span><div class="bar ${v>goal*1.08?'over':''}"><i style="width:${Math.min(100,v/goal*100)}%"></i></div><span class="num small">${Math.round(v)} / ${goal}${u}</span></div>`;
  return row('Calories',t.k,g.kcal,'')+row('Protein',t.p,g.p,' g')+row('Carbs',t.c,g.c,' g')+row('Fat',t.f,g.f,' g')}
function pfTag(k){return `<span class="tag ${EX[k].pf}">${EX[k].pf==='y'?'every PF':EX[k].pf==='m'?'most PF':'some PF'}</span>`}
/* exercise photos + step-by-step (free-exercise-db, public domain) — available when self-hosted */
function exInfo(id){return S.exinfo&&S.exinfo[id]}
function exName(id,cls){return `<button class="exname ${cls||''}" data-how="${id}" type="button">${esc(EX[id].n)}${exInfo(id)?' <span class="qm">?</span>':''}</button>`}
function exThumb(id){const i=exInfo(id);return i?`<img class="thumb" src="${i.imgs[0]}" alt="" loading="lazy">`:''}
function howTo(id){const i=exInfo(id)||{imgs:[],steps:[],muscles:[],name:''},e=EX[id];if(!e)return;
  const ov=modal(`<div class="row between nowrap"><div><div class="eyebrow">${esc(PAT[e.p])} · ${esc(e.eq)}</div><h2>${esc(e.n)}</h2></div><button class="btn sm" id="x">Close</button></div>
   <div class="howto stack" style="margin-top:10px">${i.imgs.length?'':'<p class="small muted">Photos and step-by-step load on the self-hosted app (recomp8-production.up.railway.app).</p>'}<div class="row nowrap">${i.imgs.map(s=>`<img src="${s}" alt="${esc(e.n)} position" style="flex:1;min-width:0">`).join('')}</div>
   ${e.cue?`<p><b>Coach cue:</b> ${esc(e.cue)}</p>`:''}${i.steps.length?`<ol>${i.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="small muted">Primary: ${esc(i.muscles.join(', '))}. Photos and steps from free-exercise-db (public domain); shown for the closest match, "${esc(i.name)}".</p>`:`<p><b>Pattern:</b> ${esc(PAT[e.p])} · <b>Equipment:</b> ${esc(e.eq)}</p>`}</div>`);
  $('#x',ov).onclick=()=>ov.remove()}

async function toggleMeal(d,mealId,slot,on){const f=S.food[d]||{date:d,items:[]};let items=f.items.filter(i=>i.from!==mealId);if(on)items=items.filter(i=>!(i.slot===slot&&!i.from));if(on){const mm=MEALS[mealId];items.push({n:mm.n,k:mm.k,p:mm.p,c:mm.c,f:mm.f,slot,from:mealId})}await save('food',d,{date:d,items})}
async function addBody(d,w,fat,muscle,src){const ex=S.body[d]||{};await save('body',d,{date:d,w,fat:fat||ex.fat||null,muscle:muscle||ex.muscle||null,src})}

function editDay(d){
  const p=planDay(d);const tp=TPL[p.tpl];
  const ov=modal(`<div class="row between nowrap"><div><div class="eyebrow">${esc(fmtD(d))} · Week ${weekNo(d)}</div><h2>${esc(tp.n)}</h2></div><button class="btn sm" id="x">Close</button></div>
   ${S.mode==='server'?`<form id="coachAsk" class="stack" style="margin-top:12px;padding:10px;border-radius:10px;background:var(--surface2)"><div class="eyebrow">Tell the coach what you want</div><textarea id="coachTxt" rows="2" placeholder="e.g. make this a 40-min upper session, no bench; or: swap this with Saturday"></textarea><div class="row nowrap"><button class="btn primary" style="flex:1">Ask the coach to change it</button></div><p class="small muted" style="margin:0">It knows what you did and missed this week.</p></form><div class="eyebrow" style="margin-top:14px">Or edit by hand</div>`:''}
   <div class="stack" style="margin-top:12px">
    <label class="f">Session type<select id="tplSel">${Object.entries(TPL).map(([k,v])=>`<option value="${k}" ${k===p.tpl?'selected':''}>${esc(v.n)}</option>`).join('')}</select></label>
    <label class="f">Swap this day with<select id="swapSel"><option value="">— pick a date —</option>${allDates().filter(x=>x!==d).map(x=>`<option value="${x}">${esc(fmtD(x))} · ${esc(TPL[planDay(x).tpl].n)}</option>`).join('')}</select></label>
    <div id="exList"></div>
    <button class="btn" id="addEx">+ Add exercise</button>
    <div class="row"><button class="btn primary" id="saveDay" style="flex:1">Save day</button><button class="btn" id="openLog">Open logger</button><button class="btn ghost" id="resetDay">Reset</button></div>
   </div>`);
  const state={tpl:p.tpl,ex:p.ex.map(e=>({...e}))};
  const list=$('#exList',ov);
  function draw(){list.innerHTML=state.ex.length?`<div class="eyebrow" style="margin-bottom:4px">Exercises</div>`+state.ex.map((e,i)=>`<div class="xrow"><div class="nm">${exName(e.id)}<div class="small muted">${esc(PAT[EX[e.id].p])} · ${esc(EX[e.id].eq)}</div></div><input type="number" value="${e.sets}" min="1" max="8" data-i="${i}" data-k="sets" aria-label="sets" style="width:58px;text-align:center"><span class="muted">×</span><input value="${esc(e.reps)}" data-i="${i}" data-k="reps" aria-label="reps" style="width:64px;font-family:var(--mono);text-align:center"><button class="btn sm" data-sw="${i}">Swap</button><button class="btn sm ghost" data-rm="${i}" aria-label="Remove">✕</button></div>`).join(''):'<p class="small muted">No lifts on this day.</p>';
    list.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{state.ex[+inp.dataset.i][inp.dataset.k]=inp.dataset.k==='sets'?+inp.value:inp.value});
    list.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{state.ex.splice(+b.dataset.rm,1);draw()});
    list.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>swapExercise(state.ex[+b.dataset.sw],e=>{state.ex[+b.dataset.sw]=e;draw()}));
  }
  draw();
  $('#tplSel',ov).onchange=e=>{state.tpl=e.target.value;state.ex=TPL[state.tpl].ex.map(([id,sets,reps])=>({id,sets,reps}));draw()};
  $('#addEx',ov).onclick=()=>pickExercise(null,e=>{state.ex.push(e);draw()});
  $('#resetDay',ov).onclick=async()=>{delete S.plan.days[d];await save('plan','days',S.plan);ov.remove();toast('Reset to plan');render()};
  $('#saveDay',ov).onclick=async()=>{S.plan.days[d]=state;await save('plan','days',S.plan);ov.remove();toast('Saved');render()};
  $('#swapSel',ov).onchange=async e=>{const o=e.target.value;if(!o)return;const a=planDay(d),b=planDay(o);S.plan.days[d]=b;S.plan.days[o]=a;await save('plan','days',S.plan);ov.remove();toast('Swapped '+d.slice(5)+' ↔ '+o.slice(5));render()};
  $('#openLog',ov).onclick=()=>{ov.remove();go('train',d)};
  $('#x',ov).onclick=()=>ov.remove();
  const ca=$('#coachAsk',ov);if(ca){setTimeout(()=>$('#coachTxt',ov).focus(),80);ca.onsubmit=e=>{e.preventDefault();const t=$('#coachTxt',ov).value.trim();if(!t)return;ov.remove();S.day=d;chatOpen();$('#chatIn').value=(d===today()?'For today':'For '+fmtD(d))+': '+t;chatSend()}}
}
function swapExercise(cur,cb){
  const e=EX[cur.id];const alts=Object.keys(EX).filter(k=>k!==cur.id&&EX[k].p===e.p).sort((a,b)=>(EX[a].pf>EX[b].pf?1:-1));
  const ov=modal(`<div class="row between nowrap"><div><div class="eyebrow">Replace · ${esc(PAT[e.p])}</div><h2>${esc(e.n)}</h2></div><button class="btn sm" id="x">Close</button></div>
   <p class="small muted">Same movement pattern, so the day's training goal is unchanged. Ranked by what Planet Fitness reliably has.</p>
   <div class="stack">${alts.map(k=>`<button class="opt" data-k="${k}">${exThumb(k)}<span style="flex:1;min-width:0"><b>${esc(EX[k].n)}</b> ${pfTag(k)}<br><span class="small muted">${esc(EX[k].eq)}${EX[k].cue?' · '+esc(EX[k].cue):''}</span></span><span class="k">${cur.sets}×${esc(cur.reps)}</span></button>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn" id="other" style="flex:1">Any other exercise…</button><button class="btn" id="ai" style="flex:1">Ask Claude</button></div><div id="aiOut" class="ai" hidden style="margin-top:8px"></div>`);
  ov.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{cb({...cur,id:b.dataset.k});ov.remove()});
  $('#other',ov).onclick=()=>{ov.remove();pickExercise(cur,cb)};
  $('#x',ov).onclick=()=>ov.remove();
  $('#ai',ov).onclick=()=>askAI(ov,`I train at Planet Fitness (dumbbells to 75 lb, Smith machines, cable crossover, selectorized machines for legs, chest, shoulders, back, arms and abs, assisted pull-up, benches; no squat rack, no free barbell). Suggest 3 alternatives to "${e.n}" that train the same pattern (${PAT[e.p]}) for ${cur.sets} sets of ${cur.reps}. Reply with only a JSON array of {"name","why","equipment"} objects.`,r=>Array.isArray(r)?r.map(x=>`• ${x.name} (${x.equipment||''}) — ${x.why||''}`).join('\n'):String(r));

function shrinkImage(file,max=1280){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=url})}

async function importWithings(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return 0;
  const parse=l=>{const out=[];let cur='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  const hd=parse(lines[0]).map(h=>h.toLowerCase());const col=re=>hd.findIndex(h=>re.test(h));
  const iD=col(/date/),iW=col(/^weight/),iF=col(/fat mass|fat \(|fat ratio|fat %/),iM=col(/muscle/);const kg=/kg/.test(hd[iW]||'');const fatPct=/ratio|%/.test(hd[iF]||'');
  if(iD<0||iW<0)return 0;let n=0;
  for(const l of lines.slice(1)){const c=parse(l);const dt=(c[iD]||'').slice(0,10).replace(/\//g,'-');if(!/^\d{4}-\d{2}-\d{2}$/.test(dt))continue;let w=parseFloat(c[iW]);if(!w)continue;if(kg)w*=2.20462;
    let fat=null;if(iF>=0&&c[iF]){const v=parseFloat(c[iF]);if(v)fat=fatPct?v:(kg?v*2.20462:v)/w*100}let mus=null;if(iM>=0&&c[iM]){const v=parseFloat(c[iM]);if(v)mus=kg?v*2.20462:v}
    const ex=S.body[dt];if(ex&&ex.src==='manual'&&Math.abs(ex.w-w)<0.05)continue;await save('body',dt,{date:dt,w:+w.toFixed(1),fat:fat?+fat.toFixed(1):null,muscle:mus?+mus.toFixed(1):null,src:'withings'});n++}
  return n;
}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

  const note=$('#chartnote');if(rows.length<2){note.textContent='Chart appears after two weigh-ins.';return}

  const accent=cssVar('--accent'),fg=cssVar('--fg'),muted=cssVar('--muted'),line=cssVar('--line'),blue=cssVar('--cardio');
  const labels=rows.map(r=>r.date);const avg=rows.map(r=>+avg7(r.date).toFixed(1));const fats=rows.map(r=>r.fat||null);const hasFat=fats.some(Boolean);

  $('#wipe').onclick=()=>{const ov=modal('<h2>Reset plan edits?</h2><p class="small muted">Day changes and meal swaps go back to the default plan. Logs and weigh-ins stay.</p><div class="row"><button class="btn primary" id="ok" style="flex:1">Reset</button><button class="btn ghost" id="x">Cancel</button></div>');$('#x',ov).onclick=()=>ov.remove();$('#ok',ov).onclick=async()=>{await save('plan','days',{days:{}});await save('plan','meals',{week:{}});ov.remove();render()}};
}

/* ================= AI (sample) ================= */
async function askAI(ov,prompt,fmt){
  const out=$('#aiOut',ov);out.hidden=false;
  if(!S.sample){out.textContent='Claude suggestions aren\'t available in this view. The ranked list above covers the same goal.';return}
  out.textContent='Thinking…';
  try{const r=await S.sample.json(prompt,{modelTier:'quick'});out.textContent=fmt(r)}
  catch(e){out.textContent=e.code==='not_granted'?'Claude suggestions were declined for this page.':e.code==='rate_limited'?'Too many requests right now; try again in a minute.':'Couldn\'t get suggestions ('+(e.code||'error')+').'}
}

function askPin(){return new Promise(res=>{const ov=document.createElement('div');ov.className='ov';ov.innerHTML='<div class="md" role="dialog" aria-modal="true"><h2>Enter your app PIN</h2><p class="small muted">Set once per device. It keeps your logs private on the public URL.</p><form id="pf" class="stack"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required><button class="btn primary block">Unlock</button></form></div>';document.body.appendChild(ov);$('#pf',ov).onsubmit=e=>{e.preventDefault();try{localStorage.setItem('rc8:key',$('#pin',ov).value.trim())}catch(err){}ov.remove();res()};$('#pin',ov).focus()})}

/* ================= COACH CHAT ================= */
const CHAT={msgs:[],busy:false};
function chatLoad(){CHAT.msgs=lsGet('chat')||[]}
function chatSave(){lsSet('chat',CHAT.msgs.slice(-40))}
function md(t){let h=esc(t);h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');h=h.replace(/^(?:[-•] )(.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n/g,'')+'</ul>');return h}
function chatRender(){const box=$('#msgs');box.innerHTML=CHAT.msgs.map(m=>m.role==='user'?`<div class="msg u">${esc(m.content)}</div>`:m.role==='tool'?`<div class="msg t ${m.ok?'ok':''}">${esc(m.content)}</div>`:`<div class="msg a">${md(m.content)}</div>`).join('')+(CHAT.busy&&!CHAT.streaming?'<div class="msg a"><span class="typing"></span></div>':'');box.scrollTop=box.scrollHeight}
function chatSuggestions(){const v=S.view;const list=v==='train'?['Rebuild today based on what I did and missed this week','I only have 30 min — shorten today but hit every main muscle group','Swap anything that needs a bench; they\'re all taken','What weight should I start with on the first lift?']:v==='eat'?['What should I eat tonight to land 180 g protein?','Swap tomorrow\'s lunch for something I can buy near the office','How many calories do I have left today?']:v==='body'?['How is my weight trend vs the plan?','Should I change my calories this week?']:v==='calendar'?['Move this week\'s cardio to Saturday','I\'m traveling Thu–Sun, rework the week']:['What\'s my plan today and why?','I only have 30 min today — adjust the workout','Did I hit protein yesterday?'];$('#sug').innerHTML=list.map(s=>`<button type="button">${esc(s)}</button>`).join('');$('#sug').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#chatIn').value=b.textContent;chatSend()})}
function chatOpen(){$('#chatp').hidden=false;$('#fab').hidden=true;document.body.classList.add('chat-open');chatSuggestions();chatRender();setTimeout(()=>$('#chatIn').focus(),50)}
function chatMax(on){const p=$('#chatp');const v=on===undefined?!p.classList.contains('max'):on;p.classList.toggle('max',v);document.body.classList.toggle('chat-max',v);$('#chatMax').setAttribute('aria-label',v?'Shrink chat':'Expand chat');$('#msgs').scrollTop=$('#msgs').scrollHeight}
function chatClose(){$('#chatp').hidden=true;$('#fab').hidden=S.mode!=='server';document.body.classList.remove('chat-open','chat-max')}
async function chatSend(){const ta=$('#chatIn');const text=ta.value.trim();if(!text||CHAT.busy)return;ta.value='';ta.style.height='';
  CHAT.msgs.push({role:'user',content:text});CHAT.busy=true;CHAT.streaming=false;chatSave();chatRender();$('#chatSend').disabled=true;
  const history=CHAT.msgs.filter(m=>m.role!=='tool').slice(-20);
  let reply='';let changed=false;const push=()=>{if(!CHAT.streaming){CHAT.streaming=true;CHAT.msgs.push({role:'assistant',content:''})}CHAT.msgs[CHAT.msgs.length-1].content=reply;chatRender()};
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json','x-key':apiKey()},body:JSON.stringify({messages:history,today:S.day&&S.view!=='today'?clampDay(S.day):today(),screen:S.view})});
    if(r.status===401)throw {code:'unauthorized'};if(r.status===503)throw {code:'no_key'};if(!r.ok)throw {code:'http_'+r.status};
    const rd=r.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i).replace(/^data: ?/,'');buf=buf.slice(i+2);if(!line)continue;let ev;try{ev=JSON.parse(line)}catch(e){continue}
      if(ev.type==='text'){reply+=ev.delta;push()}
      else if(ev.type==='tool'){if(CHAT.streaming){reply=reply.replace(/\n+$/,'');push();CHAT.streaming=false;reply=''}CHAT.msgs.push({role:'tool',ok:ev.ok,content:ev.name.replace(/_/g,' ')+(ev.input&&ev.input.date?' · '+ev.input.date:'')});chatRender()}
      else if(ev.type==='done'){changed=ev.changed}
      else if(ev.type==='error'){reply+=(reply?'\n':'')+'⚠ '+ev.message;push()}}}
    if(!CHAT.streaming&&!reply)CHAT.msgs.push({role:'assistant',content:'Done.'});
  }catch(e){CHAT.msgs.push({role:'assistant',content:e.code==='no_key'?'The coach needs ANTHROPIC_API_KEY on the server.':e.code==='unauthorized'?'PIN rejected — reload and enter the PIN again.':'Could not reach the coach ('+(e.code||e.message||'error')+').'})}
  CHAT.busy=false;CHAT.streaming=false;chatSave();chatRender();$('#chatSend').disabled=false;
  if(changed){try{await loadAll();if(S.meals.custom)Object.assign(MEALS,S.meals.custom);render();toast('Updated')}catch(e){}}
}
(()=>{const f=$('#fab');let drag=null,moved=false;
  const place=(x,y)=>{const w=f.offsetWidth||54,h=f.offsetHeight||54;const maxX=window.innerWidth-w-8,maxY=window.innerHeight-h-8;x=Math.max(8,Math.min(maxX,x));y=Math.max(8,Math.min(maxY,y));f.style.left=x+'px';f.style.top=y+'px';f.style.right='auto';f.style.bottom='auto';return [x,y]};
  const saved=lsGet('fabpos');if(saved&&saved.length===2)requestAnimationFrame(()=>place(saved[0],saved[1]));
  f.addEventListener('pointerdown',e=>{drag={dx:e.clientX-f.getBoundingClientRect().left,dy:e.clientY-f.getBoundingClientRect().top,x0:e.clientX,y0:e.clientY};moved=false;f.setPointerCapture(e.pointerId)});
  f.addEventListener('pointermove',e=>{if(!drag)return;if(!moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;moved=true;f.classList.add('dragging');place(e.clientX-drag.dx,e.clientY-drag.dy)});
  const end=e=>{if(!drag)return;f.classList.remove('dragging');if(moved){const r=f.getBoundingClientRect();lsSet('fabpos',place(r.left,r.top))}else chatOpen();drag=null};
  f.addEventListener('pointerup',end);f.addEventListener('pointercancel',end);
  window.addEventListener('resize',()=>{const s=lsGet('fabpos');if(s)place(s[0],s[1])});
})();
$('#chatClose').onclick=chatClose;$('#chatMax').onclick=()=>chatMax();
(()=>{let y0=null;const hd=$('#chatp .hd');hd.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;y0=e.touches[0].clientY},{passive:true});hd.addEventListener('touchend',e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;if(dy<-40)chatMax(true);else if(dy>40){if($('#chatp').classList.contains('max'))chatMax(false);else chatClose()}},{passive:true})})();
$('#chatClear').onclick=()=>{CHAT.msgs=[];chatSave();chatRender()};
$('#chatForm').onsubmit=e=>{e.preventDefault();chatSend()};
$('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend()}});
window.addEventListener('resize',()=>{const m=$('#msgs');if(m&&!$('#chatp').hidden)m.scrollTop=m.scrollHeight});
$('#chatIn').addEventListener('input',e=>{e.target.style.height='';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'});

document.addEventListener('click',e=>{const b=e.target.closest('.exname');if(b){e.preventDefault();e.stopPropagation();howTo(b.dataset.how)}},true);

/* ================= BOOT ================= */
(async function boot(){
  const v=location.hash.slice(1);if(VIEWS.includes(v))S.view=v;
  render();
  if(window.claude?.use){
    try{const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);S.db=db;S.uid=user?await user.id():null;S.mode=db?'cloud':'local'}catch(e){S.mode='local'}
  }else if(location.protocol.startsWith('http')){
    // self-hosted: probe the API; ask for the PIN once
    for(let tries=0;tries<3;tries++){
      try{const r=await fetch('/api/ping',{headers:{'x-key':apiKey()}});if(r.status===401){await askPin();continue}if(r.ok){S.mode='server';fetch('/exinfo.json').then(x=>x.json()).then(j=>{S.exinfo=j;render()}).catch(()=>{})}break}catch(e){break}
    }
  }
  try{await loadAll()}catch(e){toast('Could not load saved data');if(S.mode==='server'){S.mode='local';try{await loadAll()}catch(e2){}}}
  if(S.meals.custom)Object.assign(MEALS,S.meals.custom);
  $('#status').innerHTML=S.mode==='cloud'||S.mode==='server'?'<b>●</b> synced':'<span>●</span> this browser';
  if(S.mode==='server'){chatLoad();$('#fab').hidden=false}
  render();
  if(window.claude?.use){
    claude.use('sample').then(s=>{S.sample=s});
    claude.use('downloads').then(d=>{S.dl=d});
    claude.use('mcp').then(mcp=>{if(!mcp)return;S.mcpUn=mcp.watchTool('Strava','list_activities',{first:20,use_preferred_units:true,range_start:addDays(today(),-14)+'T00:00:00'},ev=>{
      if(ev.type==='data'){const p=ev.result.payload;S.strava=(p&&p.activities)||[];renderStrava()}
      else{const c=ev.error.code;const box=$('#stravaList');if(!box)return;if(c==='needs_reauth')box.textContent='Reconnect Strava in claude.ai Settings → Connectors to see activities here.';else if(c==='server_not_connected'||c==='not_in_manifest')box.textContent='Strava not connected for this page.';else if(c==='approval_required')box.textContent='Strava needs your approval for this page.';else if(!S.strava)box.textContent='Strava unavailable right now.'}
    },{refetchInterval:300000})});
  }
})();
</script>
